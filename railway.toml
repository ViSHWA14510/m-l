[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "bash start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1

# The bot itself only talks to Telegram's API outbound - it does not need
# a public HTTP port to function. If you want the built-in status/torrent
# web page (web/wserver.py, port 8080) reachable, generate a public domain
# for this service in Railway's Settings -> Networking tab and set BASE_URL
# below to that domain.
